<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid & Kertas - Cetak Foto Pro</title>
    <link rel="stylesheet" href="css/style.css">
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.1/cropper.min.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.1/cropper.min.js"></script>
</head>
<body>   
    <div id="gridkertas" class="page">
        <div class="page-header" style="margin-bottom: 8px; padding-bottom: 5px;">
            <h2 style="font-size: 16px;">Grid / Kertas Studio</h2>
            <a href="index.html" class="back-link" title="Kembali ke Menu">🏠</a>
        </div>
        <div class="main-content">
            <div class="sidebar-form" style="padding: 10px 12px;">
                <div class="form-group" style="margin-bottom: 6px;">
                    <label style="font-size: 12px; min-width: 110px;">Ukuran Kertas</label>
                    <select id="gridPaperSize" onchange="toggleCustomPaperInput('gridkertas'); renderUlangKertas('gridkertas', 'gridPaperSize')" style="font-size: 13px; padding: 4px 6px; height: 32px;">
                        <option value="a4" selected>A4 (21 x 29.7 cm)</option>
                        <option value="a5">A5 (14.8 x 21 cm)</option>
                        <option value="a6">A6 (10.5 x 14.8 cm)</option>
                        <option value="3r">3R (8.9 x 12.7 cm)</option>
                        <option value="4r">4R (10.2 x 15.2 cm)</option>
                        <option value="5r">5R (12.7 x 17.8 cm)</option>
                        <option value="6r">6R (15.2 x 20.3 cm)</option>
                        <option value="custom">Custom (Pilih Ukuran)</option>
                    </select>
                </div>
                
                <div class="form-group" id="groupCustomPaper_gridkertas" style="display: none; margin-bottom: 6px;">
                    <label style="font-size: 12px; min-width: 110px;">Custom (cm)</label>
                    <input type="number" id="customPaperW_gridkertas" value="20" min="1" step="0.1" placeholder="Lebar" oninput="renderUlangKertas('gridkertas', 'gridPaperSize')" style="font-size: 13px; padding: 4px 6px; height: 32px;">
                    <span style="align-self: center; font-size: 12px;">x</span>
                    <input type="number" id="customPaperH_gridkertas" value="30" min="1" step="0.1" placeholder="Tinggi" oninput="renderUlangKertas('gridkertas', 'gridPaperSize')" style="font-size: 13px; padding: 4px 6px; height: 32px;">
                </div>

                <div class="form-group" style="margin-bottom: 6px;">
                    <label style="font-size: 12px; min-width: 110px;" for="gridKolom">Kolom / Baris</label>
                    <div style="display: flex; gap: 6px; flex: 1.5;">
                        <input type="number" id="gridKolom" value="1" min="1" oninput="reflowHalaman()" style="font-size: 13px; padding: 4px 6px; height: 32px; width: 100%;">
                        <span style="align-self: center;">/</span>
                        <input type="number" id="gridBaris" value="2" min="1" oninput="reflowHalaman()" style="font-size: 13px; padding: 4px 6px; height: 32px; width: 100%;">
                    </div>
                </div>

                <div class="form-group" style="margin-bottom: 6px;">
                    <label style="font-size: 12px; min-width: 110px;"></label> 
                    <div style="flex: 1.5; width: 100%;">
                        <label style="display: inline-flex; align-items: center; gap: 6px; cursor: pointer; width: 100%;">
                            <input type="checkbox" id="gridStretch" style="width: 15px; height: 15px;" onchange="reflowHalaman()">
                            <span style="font-weight: bold; color: #198754; font-size: 12px;">↕ Penuh (Tanpa Crop)</span>
                        </label>
                    </div>
                </div>

                <input type="number" id="gridGapInput" value="6" min="0" oninput="reflowHalaman()" hidden>

                <div class="form-group" style="margin-bottom: 6px;">
                    <label style="font-size: 12px; min-width: 110px;">Margin (mm)</label>
                    <input type="number" id="gridMarginInput" value="3" min="0" oninput="reflowHalaman()" style="font-size: 13px; padding: 4px 6px; height: 32px;">
                </div>

                <div class="form-group" style="margin-bottom: 6px;">
                    <label style="font-size: 12px; min-width: 110px;">QTY (Jumlah)</label>
                    <input type="number" id="gridQtyInput" value="1" min="1" style="font-size: 13px; padding: 4px 6px; height: 32px;">
                </div>

                <div class="form-group" style="margin-bottom: 6px;">
                    <label style="font-size: 12px; min-width: 110px;">Pilih Gambar</label>
                    <button class="btn-action uploader-btn" style="font-size: 13px; padding: 4px 8px; height: 32px;">📁 Upload Foto</button>
                </div>

                <div class="form-group" style="margin-bottom: 8px;">
                    <label style="font-size: 12px; min-width: 110px;"></label> 
                    <div style="flex: 1.5; width: 100%;">
                        <label style="display: inline-flex; align-items: center; gap: 6px; cursor: pointer; width: 100%;">
                            <input type="checkbox" id="gridShowMarking" onchange="reflowHalaman()" style="width: 15px; height: 15px;">
                            <span style="font-weight: bold; color: #198754; font-size: 12px;">📐 Garis Potong (Lurus)</span>
                        </label>
                    </div>
                </div>

                <div class="button-group" style="margin-top: 6px; padding-top: 6px; gap: 5px;">
                    <button class="btn-control btn-add" style="font-size: 12px; padding: 6px 2px;" aksiTambah()>➕ Tambah</button>
                    <button class="btn-control btn-auto" style="font-size: 12px; padding: 6px 2px;" aksiOtomatis()>✨ Penuh</button>
                    <button class="btn-control btn-reset" style="font-size: 12px; padding: 6px 2px;" aksiResetForm('gridkertas')>🧹 Reset</button>
                </div>
            </div>

            <div class="workspace-container">
                <div class="zoom-controls">
                    <button class="btn-zoom" onclick="ubahZoom(0.1)">➕</button>
                    <button class="btn-zoom" onclick="ubahZoom(-0.1)">➖</button>
                    <button class="btn-zoom" onclick="resetZoom()">🔄</button>
                    <div class="export-container">
                        <button class="btn-zoom btn-export" onclick="toggleExportMenu(event, 'exportMenuGrid')">📤</button>
                        <div id="exportMenuGrid" class="export-menu">
                            <button class="export-item" onclick="aksiExport('JPEG')">🖼️ JPEG</button>
                            <button class="export-item" onclick="aksiExport('PDF')">📄 PDF</button>
                            <button class="export-item" onclick="aksiExport('Print')">🖨️ Print</button>
                        </div>
                    </div>
                </div>
                <div class="paper-wrapper">
                    <div id="workspaceGrid" class="workspace"></div>
                </div>
            </div>
        </div>
    </div>
    
    <div id="cropModal" class="crop-modal">
        <div class="crop-container-box"><img id="cropImage" src=""></div>
        <div class="crop-actions">
            <button class="btn-control btn-zoom" onclick="cropper.rotate(-90)">↺</button>
            <button class="btn-control btn-zoom" onclick="cropper.rotate(90)">↻</button>
            <button class="btn-control btn-add" onclick="terapkanCrop()">✂️ Crop</button>
            <button class="btn-control btn-reset" onclick="batalCrop()">❌ Batal</button>
        </div>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
