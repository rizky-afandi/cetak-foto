		<meta name="apple-mobile-web-app-capable" content="yes">
		<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
		<meta name="apple-mobile-web-app-title" content="CetakFoto">

			<a href="pasfoto.html"><button><div class="icon">🖼️</div>Pas Foto</button></a>

		<script src="js/app.js"></script>
		<script>
			if ('serviceWorker' in navigator) {
				window.addEventListener('load', () => {
					navigator.serviceWorker.register('./sw.js')
					.then((registration) => {
						console.log('ServiceWorker berhasil terdaftar dengan scope: ', registration.scope);
					})
					.catch((error) => {
						console.log('ServiceWorker gagal terdaftar: ', error);
					});
				});
			}
		</script>
	</body>
