<!DOCTYPE html>
<html lang="id">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		
		<link rel="manifest" href="manifest.json">
		<link rel="stylesheet" href="css/style.css">
		<meta name="theme-color" content="#2563eb">
		<meta name="apple-mobile-web-app-capable" content="yes">
		<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
		<meta name="apple-mobile-web-app-title" content="CetakFoto">
		
		<title>Cetak Foto Pro</title>
		
		<script src="js/html2canvas.min.js"></script>
		<script src="js/jspdf.umd.min.js"></script>
		<link rel="stylesheet" href="css/cropper.min.css" />
		<script src="js/cropper.min.js"></script>
	</head>
	<body>
		<!-- Header dengan Menu Titik Tiga -->
		<header id="header">
			<div class="header-title">
				<span>Studio Cetak Foto<small class="app-version">R3-2026.08.02</small></span>
			</div>
			
			<!-- Komponen Menu Titik Tiga -->
			<div class="header-menu-container">
				<button class="btn-dots-menu" onclick="toggleHeaderMenu(event)" title="Menu Opsi">⋮</button>
				<div id="headerDropdown" class="header-dropdown-menu">
					<!-- Tombol Install PWA Tambahan (Muncul Otomatis Saat Siap di-Install) -->
					<button id="btnInstallPwa" onclick="installAplikasiPWA(); tutupHeaderMenu();" style="display: none; background-color: #2563eb; color: white;">
						<span>📱</span> Install Aplikasi
					</button>
					<button onclick="hapusCacheAplikasi(); tutupHeaderMenu();">
						<span>🧹</span> Bersihkan Cache
					</button>
					<button onclick="tutupAplikasi(); tutupHeaderMenu();" class="text-danger">
						<span>❌</span> Keluar
					</button>
				</div>
			</div>
		</header>
		
		<!-- Menu Utama Dashboard -->
		<div id="main-menu" class="menu">
			<button onclick="muatHalaman('pasfoto.html')"><div class="icon">🖼️</div>Pas Foto</button>
			<button onclick="muatHalaman('grid.html')"><div class="icon">🔲</div>Grid / Kertas</button>
			<button onclick="muatHalaman('custom.html')"><div class="icon">✏️</div>Custom</button>
			<button onclick="muatHalaman('polaroid.html')"><div class="icon">📷</div>Polaroid</button>
			<button onclick="muatHalaman('hitung.html')"><div class="icon">🧮</div>Hitung Gambar</button>
		</div>
		
		<div id="app-container"></div>
		
		<script>
			// Logika Penangan Prompt Install PWA
			let deferredPrompt;
			const btnInstall = document.getElementById('btnInstallPwa');

			window.addEventListener('beforeinstallprompt', (e) => {
				// Cegah banner otomatis Chrome bawaan
				e.preventDefault();
				deferredPrompt = e;
				
				// Tampilkan tombol "Install Aplikasi" di dalam menu titik tiga
				if (btnInstall) {
					btnInstall.style.display = 'flex';
				}
			});

			function installAplikasiPWA() {
				if (!deferredPrompt) return;
				
				deferredPrompt.prompt();
				deferredPrompt.userChoice.then((choiceResult) => {
					if (choiceResult.outcome === 'accepted') {
						console.log('User menginstal PWA');
						btnInstall.style.display = 'none';
					}
					deferredPrompt = null;
				});
			}

			// UI Header Dropdown
			function toggleHeaderMenu(event) {
				event.stopPropagation();
				const menu = document.getElementById('headerDropdown');
				if (menu) {
					menu.classList.toggle('show');
				}
			}
			
			function tutupHeaderMenu() {
				const menu = document.getElementById('headerDropdown');
				if (menu) {
					menu.classList.remove('show');
				}
			}
			
			window.addEventListener('click', () => {
				tutupHeaderMenu();
			});
			
			function tutupAplikasi() {
				if (confirm("Apakah Anda yakin ingin keluar dari aplikasi?")) {
					window.close();
				}
			}
		</script>
		<!-- app.js berisi registrasi Service Worker Anda -->
		<script src="js/app.js"></script>
	</body>
</html>
