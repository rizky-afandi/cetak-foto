<div id="printgambar" class="page">
	<div class="page-header">
		<div style="display: flex; align-items: center; gap: 8px;">
			<h2>Print Gambar</h2>
			<small class="app-version" id="subpageAppVersion"></small>
		</div>
		<button onclick="kembaliKeMenu()" class="back-link" title="Kembali ke Menu">🏠</button>
	</div>
	<div class="main-content">
		<div class="sidebar-form">
			<div class="form-group">
				<label>Ukuran Kertas</label>
				<select id="printgambarPaperSize" onchange="reflowHalaman()">
					<option value="a3">A3 (29.7 x 42 cm)</option>
					<option value="f4">F4 / Folio (21.5 x 33 cm)</option>
					<option value="a4">A4 (21 x 29.7 cm)</option>
					<option value="a5">A5 (14.8 x 21 cm)</option>
					<option value="a6">A6 (10.5 x 14.8 cm)</option>
					<option value="3r" selected>3R (8.9 x 12.7 cm)</option>
					<option value="4r">4R (10.2 x 15.2 cm)</option>
					<option value="5r">5R (12.7 x 17.8 cm)</option>
					<option value="6r">6R (15.2 x 20.3 cm)</option>
					<option value="custom">Custom (Pilih Ukuran)</option>
				</select>
			</div>
			<div class="form-group" id="groupCustomPaper_printgambar" style="display: none;">
				<label>Kertas (cm)</label>
				<input type="number" id="customPaperW_printgambar" value="20" min="1" step="0.1" oninput="reflowHalaman()">
				<span>x</span>
				<input type="number" id="customPaperH_printgambar" value="30" min="1" step="0.1" oninput="reflowHalaman()">
			</div>
			
			<div class="form-group">
				<label>Opsi Cetak</label>
				<div class="checkbox-wrapper">
					<label class="checkbox-label">
						<input type="checkbox" id="printgambarBorderless" onchange="toggleBorderlessPrintgambar()" style="width: 15px; height: 15px;">
						<span style="font-weight: bold; color: #0d6efd; font-size: 12px;">🖼️ Borderless (Tanpa Tepi)</span>
					</label>
				</div>
			</div>
			
			<div class="form-group">
				<label>Margin (mm)</label>
				<input type="number" id="printgambarMarginInput" value="3" min="0" oninput="reflowHalaman()">
			</div>
			<div class="form-group">
				<label>QTY (Jumlah)</label>
				<input type="number" id="printgambarQtyInput" value="1" min="1">
			</div>
			
			<div class="form-group">
				<label>Pilih Gambar</label>
				<button class="btn-action uploader-btn">📁 Upload Foto</button>
			</div>
			
			<div class="button-group2">
				<button class="btn-control btn-add" onclick="aksiTambah()">➕ Tambah</button>
				<button class="btn-control btn-reset" onclick="aksiResetForm('printgambar')">🧹 Reset</button>
			</div>
		</div>
		<div class="workspace-container">
			<div class="zoom-controls">
				<button class="btn-zoom btn-zoom2" onclick="ubahZoom(0.1)">➕</button>
				<button class="btn-zoom btn-zoom2" onclick="ubahZoom(-0.1)">➖</button>
				<button class="btn-zoom btn-zoom2" onclick="resetZoom()">🔄</button>
				<div class="export-container">
					<button class="btn-zoom btn-export" onclick="toggleExportMenu(event, 'exportMenuCustom')">📤</button>
					<div id="exportMenuCustom" class="export-menu">
						<button class="export-item" onclick="aksiExport('JPEG')">🖼️ JPEG</button>
						<button class="export-item" onclick="aksiExport('PDF')">📄 PDF</button>
						<button class="export-item" onclick="aksiExport('Print')">🖨️ Print</button>
					</div>
				</div>
			</div>
			<div class="paper-wrapper">
				<div id="workspaceprintgambar" class="workspace"></div>
			</div>
		</div>
	</div>
</div>

<div id="cropModal" class="crop-modal">
    <div class="crop-container-box">
        <img id="cropImage" src="" alt="Preview">
	</div>
	
    <div class="crop-controls-panel">
        <div class="stretch-control">
            <label for="cropStretchCheck"><input type="checkbox" id="cropStretchCheck" onchange="toggleCropAspectMode()">
                <span>↕ Stretch</span>
			</label>
		</div>
        <div class="control-group">
            <span class="control-icon">🔍</span> <label for="cropZoomSlider">Zoom</label>
            <input type="range" id="cropZoomSlider" min="0.1" max="3" step="0.01" value="1" >
		</div>
        <div class="control-group">
            <span class="control-icon">🔄</span> <label for="cropRotateSlider">Rotasi</label>
			<input type="range" id="cropRotateSlider" min="-180" max="180" step="1" value="0">
            <span id="rotateValue">0°</span>
		</div>
        <div class="control-group">
            <span class="control-icon">☀️</span> <label for="cropBrightness">Cahaya</label>
            <input type="range" id="cropBrightness" min="0" max="200" step="1" value="100">
		</div>
        <div class="control-group">
            <span class="control-icon">🌓</span> <label for="cropContrast">Kontras</label>
            <input type="range" id="cropContrast" min="0" max="200" step="1" value="100">
		</div>
        <div class="control-group">
            <span class="control-icon">💧</span> <label for="cropSaturate">Saturasi</label>
            <input type="range" id="cropSaturate" min="0" max="200" step="1" value="100">
		</div>
	</div>
	
    <div class="crop-actions">
        <button class="btn-control btn-rotate" title="Putar Kiri" onclick="putarCepat(-90)">
            <span class="btn-icon">↺</span> <span class="btn-text">Kiri</span>
		</button>
        <button class="btn-control btn-rotate" title="Putar Kanan" onclick="putarCepat(90)">
            <span class="btn-icon">↻</span> <span class="btn-text">Kanan</span>
		</button>
        <button class="btn-control btn-reset-image" title="Reset Gambar" onclick="resetEditGambar()">
            <span class="btn-icon">🔄</span> <span class="btn-text">Reset</span>
		</button>
        <button class="btn-control btn-add" title="Terapkan Crop" onclick="terapkanCrop()">
            <span class="btn-icon">✅</span> <span class="btn-text">Crop</span>
		</button>
        <button class="btn-control btn-reset" title="Batal" onclick="batalCrop()">
            <span class="btn-icon">❌</span> <span class="btn-text">Batal</span>
		</button>
	</div>
	
</div>
