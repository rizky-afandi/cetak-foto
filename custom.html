<div id="customfoto" class="page">
	<div class="page-header">
		<div style="display: flex; align-items: center; gap: 8px;">
			<h2>Ukuran Custom</h2>
			<small class="app-version" id="subpageAppVersion"></small>
		</div>
		<button onclick="kembaliKeMenu()" class="back-link" title="Kembali ke Menu">🏠</button>
	</div>
	<div class="main-content">
		<div class="sidebar-form">
			<div class="form-group">
				<label>Ukuran Kertas</label>
				<select id="customPaperSize" onchange="renderUlangKertas('customfoto', 'customPaperSize')">
					<option value="f4">F4 / Folio (21.5 x 33 cm)</option> <!-- Tambahkan ini -->
					<option value="a4">A4 (21 x 29.7 cm)</option>
					<option value="a5">A5 (14.8 x 21 cm)</option>
					<option value="a6">A6 (10.5 x 14.8 cm)</option>
					<option value="3r" selected>3R (8.9 x 12.7 cm)</option>
					<option value="4r">4R (10.2 x 15.2 cm)</option>
					<option value="5r">5R (12.7 x 17.8 cm)</option>
					<option value="6r">6R (15.2 x 20.3 cm)</option>
					<option value="custom">Custom (Pilih Ukuran)</option>
				</select>
			</div>
			<div class="form-group" id="groupCustomPaper_customfoto" style="display: none;">
				<label>Kertas (cm)</label>
				<input type="number" id="customPaperW_customfoto" value="20" min="1" step="0.1" oninput="renderUlangKertas('customfoto', 'customPaperSize')">
				<span>x</span>
				<input type="number" id="customPaperH_customfoto" value="30" min="1" step="0.1" oninput="renderUlangKertas('customfoto', 'customPaperSize')">
			</div>
			<div class="form-group">
				<label>Lebar / P. (cm)</label>
				<input type="number" id="customLebar" value="10" min="0.1" step="0.1" oninput="reflowHalaman()">
				<span>/</span>
				<input type="number" id="customPanjang" value="10" min="0.1" step="0.1" oninput="reflowHalaman()">
			</div>
			
			<div class="form-group">
				<label>Jarak / Gap (mm)</label>
				<input type="number" id="customGapInput" value="2" min="0" oninput="reflowHalaman()">
			</div>
			<div class="form-group">
				<label>Margin (mm)</label>
				<input type="number" id="customMarginInput" value="3" min="0" oninput="reflowHalaman()">
			</div>
			<div class="form-group">
				<label>QTY (Jumlah)</label>
				<input type="number" id="customQtyInput" value="1" min="1">
			</div>
			<div class="form-group">
				<label>Pilih Gambar</label>
				<button class="btn-action uploader-btn">📁 Upload Foto</button>
			</div>
			<div class="form-group">
				<label></label> 
				<div style="flex: 1.5; width: 100%;">
					<label style="display: inline-flex; align-items: center; gap: 8px; cursor: pointer; width: 100%;">
						<input type="checkbox" id="customShowMarking" onchange="reflowHalaman()" style="width: 18px; height: 18px;">
						<span style="font-weight: bold; color: #198754; font-size: 13px;">📐 Garis Siku</span>
					</label>
				</div>
			</div>
			<div class="button-group">
				<button class="btn-control btn-add" onclick="aksiTambah()">➕ Tambah</button>
				<button class="btn-control btn-auto" onclick="aksiOtomatis()">✨ Penuh</button>
				<button class="btn-control btn-reset" onclick="aksiResetForm('customfoto')">🧹 Reset</button>
			</div>
		</div>
		<div class="workspace-container">
			<div class="zoom-controls">
				<button class="btn-zoom btn-zoom2" onclick="ubahZoom(0.1)">➕</button>
				<button class="btn-zoom btn-zoom2" onclick="ubahZoom(-0.1)">➖</button>
				<button class="btn-zoom btn-zoom2" onclick="resetZoom()">🔄</button>
				<div class="export-container">
					<button class="btn-zoom btn-export" onclick="toggleExportMenu(event, 'RataPas')">☰</button>
					<div id="RataPas" class="export-menu">
						<button class="export-item" onclick="aksiRata('flex-start')">◀ Kiri</button>
						<button class="export-item" onclick="aksiRata('center')">⬌ Tengah</button>
						<button class="export-item" onclick="aksiRata('flex-end')">▶ Kanan</button>
					</div>
				</div>
				<div class="export-container">
					<button class="btn-zoom btn-export" onclick="toggleExportMenu(event, 'exportMenuCustom')">📤</button>
					<div id="exportMenuCustom" class="export-menu">
						<button class="export-item" onclick="aksiExport('JPEG')">🖼️ JPEG</button>
						<button class="export-item" onclick="aksiExport('PDF')">📄 PDF</button>
						<button class="export-item" onclick="aksiExport('Print')">🖨️ Print</button>
					</div>
				</div>
			</div>
			<div class="paper-wrapper">
				<div id="workspaceCustom" class="workspace"></div>
			</div>
		</div>
	</div>
</div>

<div id="cropModal" class="crop-modal" style="display: flex; flex-direction: column; gap: 12px; align-items: center; justify-content: center; padding-bottom: 10px;">
	
	<div class="crop-container-box" style="margin-bottom: 0px;">
		<img id="cropImage" src="">
	</div>
	
	<div class="crop-controls-panel" style="padding: 10px; max-width: 400px; margin: 0; width: 100%;">
		
		<div style="display: grid; grid-template-columns: 1fr 1fr; gap: 5px; margin-bottom: 8px;">
			<div style="display: flex; align-items: center; gap: 5px;" title="Zoom">
				<span>🔍</span> <input type="range" id="cropZoomSlider" min="0.1" max="3" step="0.01" value="1" style="width: 100%;">
			</div>
			<div style="display: flex; align-items: center; gap: 5px;" title="Rotasi">
				<span>🔄</span> <input type="range" id="cropRotateSlider" min="-180" max="180" step="1" value="0" style="width: 100%;">
			<span id="rotateValue" hidden>0°</span> </div>
			<div style="display: flex; align-items: center; gap: 5px;" title="Cahaya">
				<span>☀️</span> <input type="range" id="cropBrightness" min="0" max="200" step="1" value="100" style="width: 100%;">
			</div>
			<div style="display: flex; align-items: center; gap: 5px;" title="Kontras">
				<span>🌓</span> <input type="range" id="cropContrast" min="0" max="200" step="1" value="100" style="width: 100%;">
			</div>
			<div style="display: flex; align-items: center; gap: 5px;" title="Saturasi">
				<span>💧</span> <input type="range" id="cropSaturate" min="0" max="200" step="1" value="100" style="width: 100%;">
			</div>
			<div style="text-align: left; margin-bottom: 4px;">
				<label style="cursor: pointer; display: flex; align-items: center; gap: 6px;">
					<input type="checkbox" id="cropStretchCheck" onchange="toggleCropAspectMode()" style="width: 15px; height: 15px;">
					<span style="font-weight: bold; color: #4ade80; font-size: 13px;">↕ Stretch</span>
				</label>
			</div>
		</div>
		
		<div style="display: flex; gap: 6px; justify-content: space-between;">
			<button class="btn-control btn-rotate" title="Putar Kiri" onclick="putarCepat(-90)" style="flex: 1; padding: 5px 0; font-size: 18px;">↺</button>
			<button class="btn-control btn-rotate" title="Putar Kanan" onclick="putarCepat(90)" style="flex: 1; padding: 5px 0; font-size: 18px;">↻</button>
			<button class="btn-control btn-reset-image" title="Reset" onclick="resetEditGambar()" style="flex: 1; padding: 5px 0; font-size: 18px;">🔄</button>
			<button class="btn-control btn-add" title="Crop" onclick="terapkanCrop()" style="flex: 1; padding: 5px 0; font-size: 18px;">✅</button>
			<button class="btn-control btn-reset" title="Batal" onclick="batalCrop()" style="flex: 1; padding: 5px 0; font-size: 18px;">❌</button>
		</div>
	</div>
</div>
